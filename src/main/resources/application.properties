# ================================================================
# APPLICATION
# ================================================================
spring.application.name=CoolShopWebsite

# ================================================================
# DATASOURCE
# ================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/CoolShop
spring.datasource.username=root
spring.datasource.password=Quang@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================================
# JPA / HIBERNATE
# ================================================================
# validate  – chỉ kiểm tra schema, không thay đổi DB (dùng khi production)
# update    – tự cập nhật schema theo Model (dùng khi development)
# create    – tạo lại schema mỗi lần start (dùng khi test)
# none      – không làm gì (dùng khi import SQL thủ công)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Đảm bảo Hibernate dùng đúng charset
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

